# Dental lead generator settings. Edit freely; every value here is read at run time.

# ---------------------------------------------------------------------------
# Your ideal customer profile (ICP)
# ---------------------------------------------------------------------------
icp:
  # Any of: general, family, cosmetic, pediatric, orthodontics, periodontics,
  # endodontics, oral_surgery, implants.  Use [any] to accept everything.
  practice_types: [general, family, cosmetic]
  target_max_age_years: 3        # practices this young or younger get full "newness" points
  newness_zero_at_years: 12      # newness points fall to 0 at this age
  min_rating: 4.5
  review_count_min: 15
  review_count_max: 150
  target_review_velocity: 4      # new reviews per month that earns full velocity points
  max_dentists: 3                # "solo or 1-3 dentists"
  selling: "website, marketing and AI receptionist services"

# ---------------------------------------------------------------------------
# Scoring weights (relative; they're normalised to a 0-100 score)
# ---------------------------------------------------------------------------
weights:
  newness: 30
  rating: 15
  review_count: 15
  review_velocity: 20
  practice_type: 10
  size: 10

# How to treat practices whose data is missing (0.0 - 1.0 credit for that component)
unknown_credit:
  newness: 0.3
  review_velocity: 0.3
  size: 0.6

# Corporate chains / DSOs. A practice is excluded (score 0, moved to the
# "Excluded" sheet) if its name or website domain contains any of these.
exclude_chains:
  - aspen dental
  - heartland dental
  - smile brands
  - bright now
  - monarch dental
  - castle dental
  - western dental
  - coast dental
  - pacific dental
  - kool smiles
  - comfort dental
  - perfect teeth
  - gentle dental
  - dental depot
  - ideal dental
  - great expressions
  - clearchoice
  - affordable dentures
  - midwest dental
  - dental care alliance
  - sonrava
  - benevis
  - sage dental
  - lone peak dental
  - smile doctors
  - brite dental
  - dentalworks
  - dental works
  - mortenson
  - kids dental kare
  - jefferson dental
  - floss dental
  - smile generation
# A name that appears at this many places or more across all results is treated
# as a multi-location group and excluded too. Set to 0 to disable.
chain_location_threshold: 3

# ---------------------------------------------------------------------------
# Where to search
# ---------------------------------------------------------------------------
# Approximate bounding boxes. Each box is cut into a grid of cells and every
# query runs once per cell (Text Search caps each query at 60 results).
cities:
  McKinney: {low: [33.130, -96.790], high: [33.260, -96.550]}
  Allen:    {low: [33.070, -96.740], high: [33.140, -96.610]}
  Plano:    {low: [32.990, -96.840], high: [33.120, -96.610]}
  Frisco:   {low: [33.080, -96.900], high: [33.240, -96.750]}
  Wylie:    {low: [32.980, -96.600], high: [33.060, -96.480]}

grid_cell_km: 4                  # smaller = more cells = more API calls, fewer missed practices
split_saturated_cells: true      # if a cell returns the full 60, quarter it once and search again

# "{city}" is replaced with the city name.
queries:
  - "dentist in {city}, TX"
  - "family dentist {city} TX"
  - "cosmetic dentist {city} TX"

# ---------------------------------------------------------------------------
# Google Places API (New)
# ---------------------------------------------------------------------------
places:
  include_reviews: true          # needed for review dates; bills the "Enterprise + Atmosphere" Text Search SKU
  page_size: 20                  # max 20; up to 3 pages (60 results) per query
  max_pages: 3
  # Estimated USD per 1,000 Text Search requests, for the cost estimate only.
  # Check https://developers.google.com/maps/billing-and-pricing/pricing for current prices and free tiers.
  price_per_1000: 40.0

# ---------------------------------------------------------------------------
# Website crawling
# ---------------------------------------------------------------------------
crawl:
  user_agent: "DentalLeadResearch/1.0 (+mailto:you@example.com)"   # put your own contact address here
  delay_seconds: 1.5             # polite delay between requests to the same site
  timeout_seconds: 15
  max_pages_per_site: 6
  workers: 4                     # sites crawled in parallel (each site is still crawled one page at a time)
  paths:
    - /about
    - /about-us
    - /meet-the-doctor
    - /meet-the-doctors
    - /our-team
    - /meet-the-team
    - /contact
    - /contact-us

# ---------------------------------------------------------------------------
# Optional extras
# ---------------------------------------------------------------------------
email:
  # When neither the website nor Hunter has an address, fill in info@<practice domain>
  # and label it "pattern guess, unverified". Set to false to leave the email blank instead.
  guess_generic_email: true

hunter:
  enabled: true                 # only used when HUNTER_API_KEY is set
  use_email_finder: true         # also call Email Finder with the dentist's name (1 credit per hit)

tsbde:
  # Path to a CSV of Texas dentist licenses (see README). Leave empty to skip.
  license_csv: ""
  name_columns: {first: "First Name", last: "Last Name"}
  license_date_column: "Original License Date"
  license_number_column: "License Number"
  city_column: "City"

# ---------------------------------------------------------------------------
# Caching and storage
# ---------------------------------------------------------------------------
cache:
  path: data/cache.sqlite
  places_ttl_days: 7             # rerunning within this window costs nothing; use --refresh to force new data
  website_ttl_days: 30
  rdap_ttl_days: 90
  hunter_ttl_days: 90

database: data/leads.sqlite
output_dir: output
